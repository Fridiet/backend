spring:
  application:
    name: fridiet
  datasource:
    url: jdbc:mysql://localhost:3306/Fridiet?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: fridiet_app
    password: change-me
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
  properties:
    default: dev
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 11MB
  data:
    redis:
      host: ""
      port: ""
      password: ""
      ssl:
        enabled: true
  mail:
    host: smtp.gmail.com
    port: 587
    username: ""
    password: ""
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

cloud:
  aws:
    credentials:
      access-key: ""
      secret-key: ""
    region:
      static: ap-northeast-2
    s3:
      bucket: fridiet-storage-bucket
      folder: dev

kakao:
  link-redirect-uri: ${KAKAO_LINK_REDIRECT_URI:http://localhost:8080/link/oauth2/code/kakao}
  client-id: ""
  redirect-uri: http://localhost:8080/login/oauth2/code/kakao
  admin-key: ""

google:
  link-redirect-uri: ${GOOGLE_LINK_REDIRECT_URI:http://localhost:8080/link/oauth2/code/google}
  client-id: ""
  client-secret: ""
  redirect-uri: http://localhost:8080/login/oauth2/code/google

jwt:
  secret: replace-with-a-long-random-secret-before-running

firebase:
  config-path: classpath:firebase/firebase-adminsdk.json

ai:
  base-url: http://localhost:8000
  service-token: ${AI_SERVICE_TOKEN:}

frontend:
  redirect-uri: http://localhost:8081/login

backend:
  qr-base-url: http://localhost:8080
